<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Haruka ChiChan Kakeibo</title>
    <script>
      // FOUC 対策：React マウント前に data-theme を確定させる
      (function () {
        try {
          var m = localStorage.getItem('budget_theme')
          if (m !== 'light' && m !== 'dark' && m !== 'auto') m = 'auto'
          var r = m
          if (m === 'auto') {
            r = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', r)
          document.documentElement.style.colorScheme = r
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
