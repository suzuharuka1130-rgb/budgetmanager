# Supabase ローカル設定（Edge Functions の JWT 検証設定）。
# すでに `supabase init` 済みで config.toml がある場合は、以下の
# [functions.*] ブロックだけを既存ファイルにマージしてください。
project_id = "budgetmanager"

# ブラウザからのCORSプリフライト(OPTIONS)を通すためゲートウェイのJWT検証はOFFにし、
# 関数内で Authorization ヘッダーのJWTを手動検証する（index.ts を参照）。
[functions.send-line-message]
verify_jwt = false

# 以下はcron（pg_cron）から service role キーで起動するため検証OFF
[functions.monthly-reminder]
verify_jwt = false

[functions.credit-input-reminder]
verify_jwt = false

[functions.monthly-report]
verify_jwt = false

# ブラウザから呼ぶため検証OFF（関数内でJWT手動検証）
[functions.analyze-receipt]
verify_jwt = false

# LINE が呼ぶため検証OFF（x-line-signature で検証）
[functions.line-webhook]
verify_jwt = false

# cron（service role）とブラウザ（設定画面の手動実行）の両方から呼ぶため検証OFF。
# 手動実行時は関数内で Authorization のJWTを検証して世帯を特定する。
[functions.daily-backup]
verify_jwt = false
